<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мой прикорм</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#fff7f0;color:#795548;font:16px system-ui}main{max-width:580px;margin:auto;padding:20px 16px 100px}h1{font-size:26px}h2{font-size:21px}small{color:#886c60}article{background:white;border-radius:20px;padding:16px;margin:12px 0}button,input,select,textarea{font:inherit;border:1px solid #ead2c4;border-radius:12px;padding:12px;color:inherit}button{background:#f4c5ae;cursor:pointer}input,select,textarea{width:100%;background:white;margin:5px 0 12px}label{display:block}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ead2c4;display:flex;justify-content:center;padding:8px 0 env(safe-area-inset-bottom,8px)}nav button{border:0;background:white;font-size:12px;padding:8px 6px}nav button.active{background:#fbe5d9} .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.food{text-align:left;background:white}.food.done{background:#f4c5ae}progress{width:100%;accent-color:#c98269} .wide{width:100%} .hero{background:#f4c5ae} .muted{font-size:13px} </style></head><body><main><header><small>🥄 Большие открытия маленькими ложками</small><h1>Мой прикорм</h1></header><div id="view"></div></main><nav id="nav"></nav><script>
const groups={Овощи:'Кабачок,Брокколи,Цветная капуста,Морковь,Тыква,Картофель,Батат,Свёкла,Огурец,Помидор,Баклажан,Перец,Капуста,Шпинат,Горошек,Кукуруза,Пастернак,Репа,Лук,Стручковая фасоль',Фрукты:'Яблоко,Груша,Банан,Авокадо,Персик,Абрикос,Слива,Нектарин,Манго,Киви,Апельсин,Мандарин,Дыня,Арбуз,Хурма,Ананас,Черника,Малина,Клубника,Смородина',Крупы:'Гречка,Рис,Овёс,Пшеница,Пшено,Киноа,Ячмень,Рожь,Булгур,Кускус,Амарант,Полба',Белковые:'Индейка,Курица,Говядина,Кролик,Свинина,Баранина,Треска,Лосось,Форель,Хек,Минтай,Яйцо,Чечевица,Нут,Фасоль,Тофу,Горох,Соя',Молочные:'Натуральный йогурт,Творог,Кефир,Рикотта,Моцарелла',Орехи_и_семена:'Арахис,Миндаль,Кешью,Грецкий орех,Фундук,Кунжут,Фисташка,Семена подсолнечника,Тыквенные семена,Лён',Прочее:'Оливковое масло,Подсолнечное масло,Сливочное масло,Укроп,Петрушка,Базилик,Корица,Имбирь,Курага,Чернослив,Ежевика,Крыжовник,Вишня,Инжир,Гранат'};const foods=Object.entries(groups).flatMap(([g,s])=>s.split(',').map(n=>({g,n})));const key='lozhka-v1';let data={profile:{name:'',birth:''},entries:[]};try{data=JSON.parse(localStorage.getItem(key))||data}catch{};let tab='home',filter='',cat='',day=today();function today(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch{alert('Не удалось сохранить данные')}}function go(t){tab=t;render()}function age(){if(!data.profile.birth)return 'Укажите дату рождения';let b=new Date(data.profile.birth+'T00:00:00'),n=new Date(),m=(n.getFullYear()-b.getFullYear())*12+n.getMonth()-b.getMonth()-(n.getDate()<b.getDate()?1:0);return Math.max(0,m)+' мес.'}function tried(){return new Set(data.entries.map(e=>e.food))}function entry(food=''){go('diary');document.querySelector('#food').value=food;document.querySelector('#food').focus()}function cards(es){return es.length?es.slice().reverse().map(e=>`<article><small>${esc(e.date)} · ${esc(e.meal)}</small><h3>${esc(e.food)}</h3><p>${esc(e.amount||'Количество не указано')} · ${esc(e.reaction)}</p><p>${esc(e.note)}</p><button data-delete="${esc(e.id)}">Удалить</button></article>`).join(''):'<article>Записей пока нет.</article>'}function render(){let v=document.querySelector('#view'),t=tried();document.querySelector('#nav').innerHTML=[['home','🏠 Главная'],['foods','🍎 Продукты'],['diary','📒 Дневник'],['calendar','📅 Даты'],['profile','👶 Профиль']].map(([id,l])=>`<button class="${tab===id?'active':''}" data-tab="${id}">${l}</button>`).join('');if(tab==='home')v.innerHTML=`<article class="hero"><small>${esc(today())}</small><h2>${esc(data.profile.name||'Ваш малыш')} · ${age()}</h2><h2>${foods.filter(f=>t.has(f.n)).length} из ${foods.length}</h2><progress max="${foods.length}" value="${foods.filter(f=>t.has(f.n)).length}"></progress><p>Продуктов попробовано</p></article><button class="wide" data-tab="diary">+ Записать приём пищи</button><h2>Последние записи</h2>${cards(data.entries.slice(-3))}`;if(tab==='foods')v.innerHTML=`<h2>Наши продукты</h2><p class="muted">Список для учёта, не план введения. Орехи и семена — только в безопасной измельчённой форме; учитывайте возраст и готовность ребёнка.</p><input id="search" placeholder="Найти продукт" value="${esc(filter)}"><select id="cat"><option value="">Все категории</option>${Object.keys(groups).map(g=>`<option ${g===cat?'selected':''}>${g}</option>`).join('')}</select><div class="grid" id="foodlist"></div>`;if(tab==='foods')list();if(tab==='diary')v.innerHTML=`<h2>Дневник питания</h2><form id="log"><label>Дата<input type="date" name="date" value="${today()}" max="${today()}" required></label><label>Продукт или блюдо<input id="food" name="food" list="options" required maxlength="100"><datalist id="options">${foods.map(f=>`<option value="${f.n}">`).join('')}</datalist></label><label>Приём пищи<select name="meal"><option>Завтрак</option><option>Обед</option><option>Ужин</option><option>Перекус</option></select></label><label>Количество<input name="amount" placeholder="Например, 2 ложки"></label><label>Реакция<select name="reaction"><option>Без замеченных реакций</option><option>Не понравилось</option><option>Возможная реакция</option><option>Не наблюдали</option></select></label><label>Текстура и заметки<textarea name="note" maxlength="1000"></textarea></label><button class="wide">Сохранить</button></form><p class="muted">При затруднённом дыхании или выраженной реакции срочно обращайтесь за медицинской помощью.</p>${cards(data.entries)}`;if(tab==='calendar')v.innerHTML=`<h2>Календарь</h2><input id="day" type="date" value="${day}">${cards(data.entries.filter(e=>e.date===day))}`;if(tab==='profile')v.innerHTML=`<h2>Профиль малыша</h2><form id="profile"><label>Имя или псевдоним<input name="name" value="${esc(data.profile.name)}" maxlength="50"></label><label>Дата рождения<input type="date" name="birth" max="${today()}" value="${esc(data.profile.birth)}"></label><button class="wide">Сохранить</button></form><article><p>Данные хранятся только в этом браузере. Не вводите лишние персональные сведения.</p><button id="export">Экспорт JSON</button> <button id="clear">Удалить все данные</button></article>`}function list(){document.querySelector('#foodlist').innerHTML=foods.filter(f=>(!cat||f.g===cat)&&f.n.toLowerCase().includes(filter.toLowerCase())).map(f=>`<button class="food ${tried().has(f.n)?'done':''}" data-food="${f.n}">${tried().has(f.n)?'✓':'＋'} ${f.n}</button>`).join('')}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab)go(b.dataset.tab);if(b.dataset.food)entry(b.dataset.food);if(b.dataset.delete&&confirm('Удалить запись?')){data.entries=data.entries.filter(x=>x.id!==b.dataset.delete);save();render()}if(b.id==='clear'&&confirm('Удалить профиль и все записи?')){data={profile:{name:'',birth:''},entries:[]};save();render()}if(b.id==='export'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='lozhka.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}});document.addEventListener('input',e=>{if(e.target.id==='search'){filter=e.target.value;list()}});document.addEventListener('change',e=>{if(e.target.id==='cat'){cat=e.target.value;list()}if(e.target.id==='day'){day=e.target.value;render()}});document.addEventListener('submit',e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(e.target.id==='profile'){data.profile=f;save();go('home')}if(e.target.id==='log'){if(!f.food.trim())return;f.food=foods.find(x=>x.n.toLowerCase()===f.food.trim().toLowerCase())?.n||f.food.trim();data.entries.push({...f,id:Date.now().toString(36)+Math.random().toString(36).slice(2)});save();render()}});window.Telegram?.WebApp?.ready();window.Telegram?.WebApp?.expand();render();</script></body></html>
