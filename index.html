<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Мой прикорм</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#fff7f0;color:#795548;font:16px system-ui}main{max-width:580px;margin:auto;padding:20px 16px calc(110px + max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px)))}h1{font-size:26px}h2{font-size:21px}small{color:#886c60}article{background:white;border-radius:20px;padding:16px;margin:12px 0}button,input,select,textarea{font:inherit;border:1px solid #ead2c4;border-radius:12px;padding:12px;color:inherit}button{background:#f4c5ae;cursor:pointer}input,select,textarea{min-width:0;max-width:100%;width:100%;background:white;margin:5px 0 12px}label{display:block}nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#fff;border-top:1px solid #ead2c4;box-shadow:0 -4px 20px #7955480d;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:8px 8px calc(12px + max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px),var(--tg-content-safe-area-inset-bottom,0px)))}nav button{min-width:0;min-height:62px;border:0;background:transparent;font-size:clamp(10px,3.1vw,13px);font-weight:600;padding:5px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;white-space:nowrap;border-radius:14px;line-height:1.2;-webkit-tap-highlight-color:transparent}nav button .nav-icon{font-size:27px;line-height:1.15}nav button.active{background:#fbe5d9;color:#795548} .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.food{text-align:left;background:white}.food.done{background:#f4c5ae}progress{width:100%;accent-color:#c98269} .wide{width:100%} .hero{background:#f4c5ae} .muted{font-size:13px} body{background:#fff8f3;color:#533a32}main{padding-top:18px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}header h1{font-size:21px;margin:0;letter-spacing:-.7px}header small{display:none}header:after{content:'🥄';background:#f9e2d5;border-radius:16px;padding:10px}h2{letter-spacing:-.6px;margin:22px 0 12px}article{border:1px solid #f0e2d9;box-shadow:0 4px 18px #8a5a3910;border-radius:24px;padding:20px}button{font-weight:600} .hero{background:linear-gradient(145deg,#ffe5d4,#f8c8b4);border:0}.hero h2{margin:5px 0}.hero .count{font-size:44px;font-weight:750;letter-spacing:-2px}.hero .count small{font-size:19px;letter-spacing:0}.hero progress{height:12px}.welcome{display:flex;align-items:center;justify-content:space-between}.welcome h2{font-size:30px;margin:0}.avatar{background:#f7e0d3;border-radius:50%;padding:15px;font-size:30px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;font-weight:700;color:#a16c57}.foodstrip{display:flex;justify-content:space-between;font-size:29px;margin:18px 0}.linkrow{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:white;border:1px solid #f0e2d9;border-radius:20px;padding:18px;margin:10px 0}.linkrow span{font-size:24px}.sub{color:#886c60;font-size:13px}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}.week button{padding:9px 0;border:0;background:#fff4eb;border-radius:12px;font-size:14px;min-height:45px}.week button.has{background:#dce8cc}.week button.selected{outline:2px solid #bd7258}.week small{display:block;font-size:11px}.recipegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.recipe{background:white;border:1px solid #f0e2d9;border-radius:20px;overflow:hidden;padding:0;text-align:left}.recipe .art{height:112px;display:grid;place-items:center;font-size:54px;background:linear-gradient(135deg,#ffe4c7,#f6c8b6)}.recipe:nth-child(even) .art{background:linear-gradient(135deg,#e7edcf,#c9ddbb)}.recipe .info{display:block;padding:12px}.recipe small{display:block;margin-top:6px}.chips{display:flex;gap:8px;overflow:auto;margin:12px 0}.chips button{white-space:nowrap;background:#fff;border:1px solid #ecd7cb;font-size:13px}.chips button.on{background:#f4c5ae}nav{background:#fffaf6f5;backdrop-filter:blur(14px)}nav button .nav-icon{display:grid;place-items:center;height:30px}nav svg{width:27px;height:27px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}nav button[data-tab="add"] .nav-icon{width:49px;height:49px;border-radius:18px;background:#b96b51;color:white;box-shadow:0 4px 12px #b96b5140}nav button[data-tab="add"]{gap:2px}nav button.active{color:#a04f35;background:#fbe5d9}.danger{color:#a13d36;background:white}.muted{line-height:1.5} .empty{text-align:center;padding:24px;color:#886c60}</style></head><body><main><header><h1>Мой прикорм</h1></header><div id="view"></div></main><nav id="nav" aria-label="Основная навигация"></nav><script>
const groups={Овощи:'Кабачок,Брокколи,Цветная капуста,Морковь,Тыква,Картофель,Батат,Свёкла,Огурец,Помидор,Баклажан,Перец,Капуста,Шпинат,Горошек,Кукуруза,Пастернак,Репа,Лук,Стручковая фасоль',Фрукты:'Яблоко,Груша,Банан,Авокадо,Персик,Абрикос,Слива,Нектарин,Манго,Киви,Апельсин,Мандарин,Дыня,Арбуз,Хурма,Ананас,Черника,Малина,Клубника,Смородина',Крупы:'Гречка,Рис,Овёс,Пшеница,Пшено,Киноа,Ячмень,Рожь,Булгур,Кускус,Амарант,Полба',Белковые:'Креветки,Краб,Индейка,Курица,Говядина,Кролик,Свинина,Баранина,Треска,Лосось,Форель,Хек,Минтай,Яйцо,Чечевица,Нут,Фасоль,Тофу,Горох,Соя',Молочные:'Натуральный йогурт,Творог,Кефир,Рикотта,Моцарелла',Орехи_и_семена:'Арахис,Миндаль,Кешью,Грецкий орех,Фундук,Кунжут,Фисташка,Семена подсолнечника,Тыквенные семена,Лён',Прочее:'Оливковое масло,Подсолнечное масло,Сливочное масло,Укроп,Петрушка,Базилик,Корица,Имбирь,Курага,Чернослив,Ежевика,Крыжовник,Вишня,Инжир,Гранат'};const foods=Object.entries(groups).flatMap(([g,s])=>s.split(',').map(n=>({g,n})));const key='lozhka-v1';let data={profile:{name:'',birth:''},entries:[]};try{data=JSON.parse(localStorage.getItem(key))||data}catch{};let tab='home',filter='',cat='',day=today();function today(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch{alert('Не удалось сохранить данные')}}function go(t){tab=t;render();window.scrollTo(0,0)}function age(){if(!data.profile.birth)return 'Укажите дату рождения';let b=new Date(data.profile.birth+'T00:00:00'),n=new Date(),m=(n.getFullYear()-b.getFullYear())*12+n.getMonth()-b.getMonth()-(n.getDate()<b.getDate()?1:0);return Math.max(0,m)+' мес.'}function tried(){return new Set(data.entries.map(e=>e.food))}function entry(food=''){go('add');document.querySelector('#food').value=food;document.querySelector('#food').focus()}function cards(es){return es.length?es.slice().reverse().map(e=>`<article><small>${esc(e.date)} · ${esc(e.meal)}</small><h3>${esc(e.food)}</h3><p>${esc(e.amount||'Количество не указано')} · ${esc(e.reaction)}</p><p>${esc(e.note)}</p><button data-delete="${esc(e.id)}">Удалить</button></article>`).join(''):'<article>Записей пока нет.</article>'}
const paths={home:'<path d="M3 10 12 3l9 7v10H3z"/><path d="M9 20v-7h6v7"/>',recipes:'<rect x="5" y="3" width="15" height="18" rx="3"/><path d="M5 16h15M9 7h7"/>',add:'<path d="M12 5v14M5 12h14"/>',diary:'<rect x="4" y="3" width="16" height="18" rx="3"/><path d="M9 3v18M12 8h5M12 12h5"/>',profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>'};
function ico(id){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+paths[id]+'</svg>'}
const allergens=[['Молоко',['Натуральный йогурт','Творог','Кефир','Рикотта','Моцарелла','Сливочное масло']],['Яйцо',['Яйцо']],['Рыба',['Треска','Лосось','Форель','Хек','Минтай']],['Пшеница',['Пшеница','Булгур','Кускус','Полба']],['Соя',['Соя','Тофу']],['Арахис',['Арахис']],['Орехи',['Миндаль','Кешью','Грецкий орех','Фундук','Фисташка']],['Кунжут',['Кунжут']],['Ракообразные',['Креветки','Краб']]];
const recipes=[['Тыквенное пюре','🎃','Тыква','Обед',20,'Тыкву очистить, приготовить на пару до мягкости, размять до подходящей текстуры.'],['Гречневая каша','🥣','Гречка','Завтрак',20,'Разварить гречку в воде до мягкости, при необходимости измельчить.'],['Яблоко с грушей','🍐','Яблоко,Груша','Перекус',15,'Удалить сердцевины, приготовить фрукты до мягкости и размять.'],['Брокколи с картофелем','🥦','Брокколи,Картофель','Обед',25,'Приготовить овощи до мягкости, размять и остудить.'],['Овсяная каша с бананом','🍌','Овёс,Банан','Завтрак',15,'Разварить овёс в воде, добавить размятый банан.'],['Индейка с кабачком','🍲','Индейка,Кабачок','Ужин',30,'Полностью приготовить индейку и кабачок, измельчить до подходящей текстуры.']];
let recipeFilter='',recipeSearch='',knownOnly=false,recipeId=-1,period=7;
function dateShift(n){let d=new Date();d.setDate(d.getDate()+n);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function dateLabel(s){return new Date(s+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}
function recipeCards(){let t=tried();return recipes.map((r,i)=>({r,i})).filter(({r})=>(!recipeFilter||r[3]===recipeFilter)&&(!knownOnly||r[2].split(',').every(x=>t.has(x)))&&(r[0]+' '+r[2]).toLowerCase().includes(recipeSearch.toLowerCase())).map(({r,i})=>'<button class="recipe" data-recipe="'+i+'"><span class="art">'+r[1]+'</span><span class="info">'+r[0]+'<small>'+r[4]+' мин · '+(r[2].split(',').every(x=>t.has(x))?'✓ Знакомые продукты':'Проверьте ингредиенты')+'</small></span></button>').join('')||'<p>Нет подходящих рецептов.</p>'}
function diaryView(){let dates=Array.from({length:period},(_,i)=>dateShift(i-period+1)),es=data.entries.filter(e=>dates.includes(e.date));return '<h2>Дневник питания</h2><div class="chips">'+[7,14,30].map(n=>'<button data-period="'+n+'" class="'+(period===n?'on':'')+'">'+({7:'Неделя',14:'2 недели',30:'30 дней'}[n])+'</button>').join('')+'</div><article><strong>'+dateLabel(dates[0])+' — '+dateLabel(dates.at(-1))+'</strong><p class="sub">'+new Set(es.map(e=>e.date)).size+' из '+period+' дней с записями</p><div class="week">'+dates.map(d=>'<button data-day="'+d+'" class="'+(data.entries.some(e=>e.date===d)?'has ':'')+(d===day?'selected':'')+'"><small>'+new Date(d+'T12:00:00').toLocaleDateString('ru-RU',{weekday:'short'})+'</small>'+Number(d.slice(-2))+'</button>').join('')+'</div><p class="sub">● Зелёный — есть записи</p></article><h2>'+dateLabel(day)+'</h2><button class="wide" data-tab="add">+ Добавить питание</button>'+cards(data.entries.filter(e=>e.date===day))+'<h2>За выбранный период</h2><article><strong>'+es.length+' записей</strong><p>Возможные реакции: '+es.filter(e=>e.reaction==='Возможная реакция').length+'</p></article>'}
function render(){let v=document.querySelector('#view'),t=tried();document.querySelector('#nav').innerHTML=[['home','Главная'],['recipes','Рецепты'],['add','Запись'],['diary','Дневник'],['profile','Профиль']].map(([id,l])=>'<button class="'+(tab===id?'active':'')+'" data-tab="'+id+'" '+(tab===id?'aria-current="page"':'')+'><span class="nav-icon">'+ico(id)+'</span><span>'+l+'</span></button>').join('');if(tab==='home'){let count=foods.filter(f=>t.has(f.n)).length,ac=allergens.filter(a=>a[1].some(x=>t.has(x))).length;v.innerHTML='<div class="welcome"><div><div class="eyebrow">Наши открытия</div><h2>'+esc(data.profile.name||'Ваш малыш')+'</h2><p class="sub">'+age()+'</p></div><div class="avatar">🐻</div></div><article class="hero"><div class="eyebrow">Путь прикорма</div><div class="foodstrip">🥑 🥕 🥦 🍐 🥣</div><div class="count">'+count+' <small>/ '+foods.length+'</small></div><progress max="'+foods.length+'" value="'+count+'"></progress><p>Продуктов отмечено</p><button class="wide" data-tab="foods">Открыть продукты →</button></article><article><div class="eyebrow">Аллергены</div><h2>'+ac+' / '+allergens.length+'</h2><p class="sub">Отмеченные группы, не подтверждение переносимости</p><button class="wide" data-tab="allergens">Посмотреть группы</button></article><button class="linkrow" data-tab="recipes"><div>Идеи для меню<br><small>Рецепты и знакомые продукты</small></div><span>›</span></button><h2>Сегодня</h2>'+cards(data.entries.filter(e=>e.date===today()))}if(tab==='allergens')v.innerHTML='<h2>Аллергены</h2><p class="muted">Учёт знакомства с группами продуктов. Отметка не означает отсутствие аллергии.</p>'+allergens.map(a=>'<article><strong>'+a[0]+'</strong><p class="sub">'+(a[1].some(x=>t.has(x))?'Есть запись':'Пока нет записи')+'</p></article>').join('')+'<button data-tab="foods">К продуктам</button>';if(tab==='recipes')v.innerHTML='<h2>Что приготовим?</h2><p class="sub">Идеи для прикорма с учётом готовности малыша</p><input id="recipeSearch" placeholder="Найти блюдо или продукт" value="'+esc(recipeSearch)+'"><div class="chips">'+['','Завтрак','Обед','Ужин','Перекус'].map(x=>'<button data-rfilter="'+x+'" class="'+(recipeFilter===x?'on':'')+'">'+(x||'Все')+'</button>').join('')+'</div><button id="known" class="wide">'+(knownOnly?'✓ ':'')+'Только знакомые продукты</button><p class="muted">Подбирайте безопасную текстуру по навыкам ребёнка. Рецепты не заменяют рекомендации педиатра.</p><div class="recipegrid" id="recipegrid">'+recipeCards()+'</div>';if(tab==='recipe'){let r=recipes[recipeId];v.innerHTML='<button data-tab="recipes">← Рецепты</button><article><div class="avatar" style="text-align:center;font-size:64px">'+r[1]+'</div><h2>'+r[0]+'</h2><p>'+r[4]+' мин · '+r[3]+'</p><h3>Ингредиенты</h3><p>'+r[2].replaceAll(',',', ')+'</p><h3>Приготовление</h3><p>'+r[5]+'</p><p class="muted">Без добавления соли и сахара. Подавайте в безопасной текстуре, под присмотром.</p></article>'}if(tab==='diary')v.innerHTML=diaryView();if(tab==='foods')v.innerHTML=`<h2>Наши продукты</h2><p class="muted">Список для учёта, не план введения. Орехи и семена — только в безопасной измельчённой форме; учитывайте возраст и готовность ребёнка.</p><input id="search" placeholder="Найти продукт" value="${esc(filter)}"><select id="cat"><option value="">Все категории</option>${Object.keys(groups).map(g=>`<option ${g===cat?'selected':''}>${g}</option>`).join('')}</select><div class="grid" id="foodlist"></div>`;if(tab==='foods')list();if(tab==='add')v.innerHTML=`<h2>Новая запись</h2><form id="log"><label>Дата<input type="date" name="date" value="${today()}" max="${today()}" required></label><label>Продукт или блюдо<input id="food" name="food" list="options" required maxlength="100"><datalist id="options">${foods.map(f=>`<option value="${f.n}">`).join('')}</datalist></label><label>Приём пищи<select name="meal"><option>Завтрак</option><option>Обед</option><option>Ужин</option><option>Перекус</option></select></label><label>Количество<input name="amount" placeholder="Например, 2 ложки"></label><label>Реакция<select name="reaction"><option>Без замеченных реакций</option><option>Не понравилось</option><option>Возможная реакция</option><option>Не наблюдали</option></select></label><label>Текстура и заметки<textarea name="note" maxlength="1000"></textarea></label><button class="wide">Сохранить</button></form><p class="muted">При затруднённом дыхании или выраженной реакции срочно обращайтесь за медицинской помощью.</p>${cards(data.entries)}`;if(tab==='calendar')v.innerHTML=`<h2>Календарь</h2><input id="day" type="date" value="${day}">${cards(data.entries.filter(e=>e.date===day))}`;if(tab==='profile')v.innerHTML=`<h2>Профиль малыша</h2><form id="profile"><label>Имя или псевдоним<input name="name" value="${esc(data.profile.name)}" maxlength="50"></label><label>Дата рождения<input type="date" name="birth" max="${today()}" value="${esc(data.profile.birth)}"></label><button class="wide">Сохранить</button></form><article><p>Данные хранятся только в этом браузере. Не вводите лишние персональные сведения.</p><button id="export">Экспорт JSON</button> <button id="clear">Удалить все данные</button></article>`}function list(){document.querySelector('#foodlist').innerHTML=foods.filter(f=>(!cat||f.g===cat)&&f.n.toLowerCase().includes(filter.toLowerCase())).map(f=>`<button class="food ${tried().has(f.n)?'done':''}" data-food="${f.n}">${tried().has(f.n)?'✓':'＋'} ${f.n}</button>`).join('')}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab)go(b.dataset.tab);if(b.dataset.recipe!==undefined){recipeId=Number(b.dataset.recipe);go('recipe')}if(b.dataset.rfilter!==undefined){recipeFilter=b.dataset.rfilter;render()}if(b.id==='known'){knownOnly=!knownOnly;render()}if(b.dataset.period){period=Number(b.dataset.period);render()}if(b.dataset.day){day=b.dataset.day;render()}if(b.dataset.food)entry(b.dataset.food);if(b.dataset.delete&&confirm('Удалить запись?')){data.entries=data.entries.filter(x=>x.id!==b.dataset.delete);save();render()}if(b.id==='clear'&&confirm('Удалить профиль и все записи?')){data={profile:{name:'',birth:''},entries:[]};save();render()}if(b.id==='export'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='lozhka.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}});document.addEventListener('input',e=>{if(e.target.id==='recipeSearch'){recipeSearch=e.target.value;document.querySelector('#recipegrid').innerHTML=recipeCards()}if(e.target.id==='search'){filter=e.target.value;list()}});document.addEventListener('change',e=>{if(e.target.id==='cat'){cat=e.target.value;list()}if(e.target.id==='day'){day=e.target.value;render()}});document.addEventListener('submit',e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(e.target.id==='profile'){data.profile=f;save();go('home')}if(e.target.id==='log'){if(!f.food.trim())return;f.food=foods.find(x=>x.n.toLowerCase()===f.food.trim().toLowerCase())?.n||f.food.trim();data.entries.push({...f,id:Date.now().toString(36)+Math.random().toString(36).slice(2)});save();day=f.date;go('diary')}});window.Telegram?.WebApp?.ready();window.Telegram?.WebApp?.expand();render();</script></body></html>
